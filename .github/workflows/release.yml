name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты перед релизом
        run: ./gradlew testDebugUnitTest

      # Релиз обязан быть подписан тем же ключом, что и предыдущий: иначе он
      # не встанет поверх установленного, и автообновление сломается у всех.
      - name: Восстановить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret KEYSTORE_BASE64 не задан — релиз был бы неподписанным"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Сборка релиза
        run: ./gradlew assembleRelease

      - name: Проверка артефакта
        id: apk
        run: |
          # UpdateChecker берёт из релиза ПЕРВЫЙ .apk, поэтому файл должен быть
          # ровно один: несколько ассетов сломали бы обновление молча.
          count=$(find app/build/outputs/apk/release -name '*.apk' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::в релизе должен быть ровно один APK, найдено $count"
            exit 1
          fi
          apk=$(find app/build/outputs/apk/release -name '*.apk')
          size=$(stat -c%s "$apk")
          limit=$((3 * 1024 * 1024))
          printf 'APK: %s, %s байт\n' "$apk" "$size"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::APK превысил потолок в 3 МБ"
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # Имя тега без «v» должно совпадать с versionName: UpdateChecker
      # сравнивает именно их, и расхождение даёт вечное «доступно обновление».
      - name: Сверить тег с versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$tag" != "$name" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с versionName $name"
            exit 1
          fi

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=CHANGELOG.md
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
