name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка и тесты
        run: ./gradlew assembleDebug testDebugUnitTest lint

      # Размер APK — ограничение проекта, а не пожелание: обновление человек
      # качает руками, возможно с мобильного интернета. Без этой проверки
      # бюджет размывается незаметно, по одной зависимости за раз.
      - name: Проверка размера release-APK
        run: |
          ./gradlew assembleRelease -PallowUnsignedRelease
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          size=$(stat -c%s "$apk")
          limit=$((3 * 1024 * 1024))
          printf 'APK %s: %s байт (потолок %s)\n' "$apk" "$size" "$limit"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::APK превысил потолок в 3 МБ"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
